[project]
name = "ezra-core"
version = "0.1.0a0"
description = "Ezra — enterprise multi-agent platform runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pymongo>=4.10",
    "redis>=5.0",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "litellm>=1.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.23",
]
# Heavy local-inference models (NLI DeBERTa + MiniLM embedder). Opt-in:
#   uv sync --group ml   (or set EZRA_RUN_NLI_TESTS=1 and install) — large (torch).
# Unit tests run against in-memory fakes and do NOT require this group.
ml = [
    "sentence-transformers>=3.0",
]
# Heavy demo data-ingestion sources (FastF1 timing + BigQuery public F1 dataset).
# Opt-in: only the GKE ingest image installs these. Unit tests inject fakes.
ingest = [
    "fastf1>=3.3",
    "google-cloud-bigquery>=3.20",
]
# Google ADK — the agent runtime that consumes Ezra (real multi-agent demo).
# Installed in the dev image + the GKE agents image; unit tests stub the runner.
agents = [
    "google-adk>=2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
