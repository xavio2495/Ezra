# Maps Secret Manager secrets into the pod via the GKE Secret Manager add-on
# (provider "gke"; enabled by secret_manager_config in deploy/terraform/gke.tf).
# `secretObjects` syncs them into a Kubernetes Secret named ezra-secrets with
# EZRA_* keys, which the Deployment consumes via envFrom. The sync only happens
# while a pod mounts this volume (the ezra-api Deployment does).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ezra-secrets
  namespace: ezra
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/ezra-498021/secrets/ezra-mongodb-uri/versions/latest"
        path: "ezra-mongodb-uri"
      - resourceName: "projects/ezra-498021/secrets/ezra-llm-api-key/versions/latest"
        path: "ezra-llm-api-key"
      - resourceName: "projects/ezra-498021/secrets/ezra-api-bearer-token/versions/latest"
        path: "ezra-api-bearer-token"
  secretObjects:
    - secretName: ezra-secrets
      type: Opaque
      data:
        - objectName: ezra-mongodb-uri
          key: EZRA_MONGODB_URI
        - objectName: ezra-llm-api-key
          key: EZRA_LLM_API_KEY
        - objectName: ezra-api-bearer-token
          key: EZRA_API_BEARER_TOKEN
