# Maps Secret Manager secrets into the pod as FILES via the GKE Secret Manager
# add-on (provider "gke"; driver secrets-store-gke.csi.k8s.io, enabled by
# secret_manager_config in deploy/terraform/gke.tf). Each secret mounts at
# /mnt/secrets-store/<path>; asgi.py reads those files into EZRA_* env vars at
# startup. NOTE: the GKE managed provider mounts files only — it does NOT sync a
# Kubernetes Secret (secretObjects is unsupported), so we read the files instead.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ezra-secrets
  namespace: ezra
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/ezra-498021/secrets/ezra-mongodb-uri/versions/latest"
        path: "ezra-mongodb-uri"
      - resourceName: "projects/ezra-498021/secrets/ezra-llm-api-key/versions/latest"
        path: "ezra-llm-api-key"
      - resourceName: "projects/ezra-498021/secrets/ezra-api-bearer-token/versions/latest"
        path: "ezra-api-bearer-token"
