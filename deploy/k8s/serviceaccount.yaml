# GKE Kubernetes SA, bound to the runtime GSA via Workload Identity (the binding
# itself is created in deploy/terraform/iam.tf). Pods using this KSA impersonate
# the GSA — keyless — to read Secret Manager secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ezra-api
  namespace: ezra
  annotations:
    iam.gke.io/gcp-service-account: ezra-ai-developer@ezra-498021.iam.gserviceaccount.com
