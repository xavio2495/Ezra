# Hot tier — Redis, ephemeral (persistence disabled; hot state is transient by
# design). Same image as dev compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ezra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ezra
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
