# One-off F1 data-ingestion Job (NOT in kustomization — apply on demand):
#   kubectl apply -f deploy/k8s/ingest-job.yaml
#   kubectl -n ezra logs -f job/ezra-ingest
#   kubectl -n ezra delete job ezra-ingest   # before re-running
#
# Fetches Jolpica + OpenF1 (REST) + BigQuery public F1 dataset + FastF1 timing,
# and upserts into Atlas. BigQuery auths keyless via Workload Identity (the
# ezra-api KSA -> ezra-ai-developer GSA, which has bigquery.jobUser); the Atlas
# URI comes from the Secret Manager CSI mount (read by the secret-file loader).
apiVersion: batch/v1
kind: Job
metadata:
  name: ezra-ingest
  namespace: ezra
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 5400   # the full 1950→2025 grind is rate-limited; allow 90 min
  template:
    spec:
      serviceAccountName: ezra-api
      restartPolicy: Never
      containers:
        - name: ezra-ingest
          image: us-east1-docker.pkg.dev/ezra-498021/ezra/ezra-ingest:latest
          envFrom:
            - configMapRef:
                name: ezra-config
          env:
            - name: EZRA_GCP_PROJECT_ID
              value: "ezra-498021"
            - name: EZRA_FASTF1_CACHE_DIR
              value: "/tmp/fastf1_cache"
            # Full historical spine → Mongo + Snowflake + BigQuery.
            - name: EZRA_INGEST_WIDE
              value: "true"
            - name: EZRA_INGEST_SEASON_START
              value: "1950"
            - name: EZRA_INGEST_SEASON_END
              value: "2025"
            - name: EZRA_INGEST_SNOWFLAKE
              value: "true"
            - name: EZRA_INGEST_BIGQUERY
              value: "true"
            # FastF1 timing needs a heavier pull; off for the wide run by default.
            - name: EZRA_INGEST_FASTF1
              value: "false"
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: cache
              mountPath: /tmp/fastf1_cache
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ezra-secrets
        - name: cache
          emptyDir: {}
