apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secretproviderclass.yaml
  - redis.yaml
  - qdrant.yaml
  - ezra-api.yaml

# The deploy script overrides newTag with the pushed image tag.
images:
  - name: ezra-api
    newName: us-east1-docker.pkg.dev/ezra-498021/ezra/ezra-api
    newTag: latest
