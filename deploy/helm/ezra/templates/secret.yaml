{{- if eq .Values.secrets.backend "kubernetes" }}
{{- /* Preserve a generated bearer token across upgrades via lookup. */ -}}
{{- $secretName := include "ezra.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $bearer := .Values.secrets.values.apiBearerToken -}}
{{- if and (not $bearer) $existing $existing.data -}}
{{- $bearer = (index $existing.data "EZRA_API_BEARER_TOKEN" | default "" | b64dec) -}}
{{- end -}}
{{- $bearer = $bearer | default (randAlphaNum 48) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels: {{- include "ezra.labels" . | nindent 4 }}
type: Opaque
stringData:
  EZRA_MONGODB_URI: {{ required "secrets.values.mongodbUri is required (your MongoDB Atlas URI)" .Values.secrets.values.mongodbUri | quote }}
  EZRA_API_BEARER_TOKEN: {{ $bearer | quote }}
  {{- if eq .Values.llm.provider "gemini" }}
  EZRA_LLM_API_KEY: {{ required "secrets.values.llmApiKey is required when llm.provider=gemini" .Values.secrets.values.llmApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.values.mongodbPublicKey }}
  EZRA_MONGODB_PUBLIC_KEY: {{ .Values.secrets.values.mongodbPublicKey | quote }}
  EZRA_MONGODB_PRIVATE_KEY: {{ required "mongodbPrivateKey is required when mongodbPublicKey is set" .Values.secrets.values.mongodbPrivateKey | quote }}
  {{- end }}
{{- end }}
