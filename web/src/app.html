<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!-- Favicons / app icons -->
		<link rel="icon" href="/favicon/favicon.ico" sizes="any" />
		<link rel="icon" type="image/svg+xml" href="/ezra-icon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
		<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
		<link rel="manifest" href="/favicon/site.webmanifest" />
		<meta name="theme-color" content="#07171a" />

		<!-- Social preview -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Ezra" />
		<meta property="og:image" content="/favicon/android-chrome-512x512.png" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:image" content="/favicon/android-chrome-512x512.png" />

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Serif:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
