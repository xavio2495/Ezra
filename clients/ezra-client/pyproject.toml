[project]
name = "ezra-client"
version = "0.1.0"
description = "Slim SDK for driving a deployed Ezra multi-agent platform over HTTP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "the Ezra authors" }]
keywords = ["ezra", "multi-agent", "llm", "agents", "adk", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# The ADK integration (EzraToolset / ezra_adk_tools as managed ADK tools).
# The client core needs neither — only constructing an EzraToolset imports it.
adk = ["google-adk>=2.0"]

[project.urls]
Homepage = "https://github.com/xavio2495/Ezra"
Repository = "https://github.com/xavio2495/Ezra"
Documentation = "https://ezra128.vercel.app/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ezra_client"]
